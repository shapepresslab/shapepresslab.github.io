<style>
body{margin:0}img{max-width:100%}

/* Layout: drafting-table tool — style rail | poster stage + variations | settings panel. Mobile stacks with a bottom action bar. */
:root{
  --bg:#E4E3DE; --surface:#F6F5F1; --surface-2:#ECEBE6; --ink:#18181B; --muted:#6A6964;
  --line:#D3D1CA; --accent:#2B3FF2; --accent-ink:#FFFFFF; --stage:#D8D7D1;
  --shadow:0 22px 44px -20px rgba(24,24,40,.45), 0 2px 6px rgba(24,24,40,.12);
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141417; --surface:#1C1C20; --surface-2:#25252A; --ink:#EDECE7; --muted:#9C9A94;
  --line:#303036; --accent:#7A88FF; --accent-ink:#0E0E14; --stage:#0E0E11;
  --shadow:0 22px 44px -18px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141417; --surface:#1C1C20; --surface-2:#25252A; --ink:#EDECE7; --muted:#9C9A94;
  --line:#303036; --accent:#7A88FF; --accent-ink:#0E0E14; --stage:#0E0E11;
  --shadow:0 22px 44px -18px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.seed{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--muted)}

/* main grid */
.main{display:grid;grid-template-columns:184px minmax(0,1fr) 340px;min-height:0}
.rail{overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.rail h2,.panel h2,.vars h2{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.style-btn{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:10px;border:1px solid transparent;background:none}
.style-btn:hover{background:var(--surface-2)}
.style-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.style-btn .th{width:44px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);background:var(--surface-2)}
.style-btn .th svg{display:block;width:100%;height:100%}
.style-btn b{display:block;font-weight:600;font-size:13px}
.style-btn span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}

.center{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;background:var(--stage)}
.stage{min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}
.poster{box-shadow:var(--shadow);line-height:0;flex:none}
.poster svg{display:block;width:100%;height:100%}
.vars{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px}
.vars-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.vars-head h2{margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 2px}
.legal{margin:8px 0 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted)}
.vars-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.var{flex:none;height:96px;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--surface-2);overflow:hidden;line-height:0;transition:transform .15s}
.var:hover{transform:translateY(-2px);border-color:var(--ink)}
.var svg{height:100%;width:auto;display:block}

/* panel */
.panel{overflow:auto;border-left:1px solid var(--line);background:var(--surface)}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
.sec-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.sec-note{font-size:12.5px;color:var(--muted);margin:-6px 0 0;line-height:1.45}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label,.ctl .lbl{font-weight:500;font-size:13px}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;margin:0}
select,input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px;font-family:var(--f-mono);font-size:13px;line-height:1.4}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.palettes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pal-group{font-family:var(--f-mono);font-size:11px!important;font-weight:500!important;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-6px}
.shade-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.pal{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;gap:5px}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pal .strip{display:flex;height:16px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal .strip i{flex:1}
.pal span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.font-btn{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:6px 10px;color:var(--ink);min-width:0}
.font-btn svg{max-width:100%;max-height:100%;height:22px;width:auto;display:block}
.font-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.15);overflow:visible}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sw .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.sw:hover .x,.sw:focus-within .x{display:flex}
.sw-add{width:34px;height:34px;border-radius:8px;border:1px dashed var(--muted);background:none;color:var(--muted);font-size:18px;line-height:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface-2);position:relative}
.color-field i{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.color-field span{font-size:12.5px}
.color-field input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{height:32px;font-size:12.5px;padding:0 10px}

/* export popover */
.pop{position:fixed;top:60px;right:16px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;z-index:20;display:flex;flex-direction:column;gap:14px}
.pop h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.pop .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.pop .btn.primary{height:44px;justify-content:center;font-size:15px}
.scrim{position:fixed;inset:0;z-index:19;background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.mbar{display:none}
.hide-sm{}

@media (max-width:1180px){ .main{grid-template-columns:150px minmax(0,1fr) 310px} .style-btn{grid-template-columns:1fr} .style-btn .th{width:100%} .style-btn span{display:none} }
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  .hide-sm{display:none!important}
  .main{display:block}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;gap:8px}
  .rail h2{display:none}
  .style-btn{flex:none;width:76px;grid-template-columns:1fr;gap:4px;padding:4px}
  .style-btn .th{width:100%}
  .style-btn b{font-size:11.5px;text-align:center}
  .stage{padding:20px 16px}
  .panel{border-left:0;padding-bottom:84px}
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:15}
  .mbar .btn{flex:1;justify-content:center;height:44px}
  .pop{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:90px}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>
