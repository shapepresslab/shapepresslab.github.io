<style>
body{margin:0}img{max-width:100%}

/* Layout: drafting-table tool — style rail | poster stage + variations | settings panel. Mobile stacks with a bottom action bar. */
:root{
  --bg:#E4E3DE; --surface:#F6F5F1; --surface-2:#ECEBE6; --ink:#18181B; --muted:#6A6964;
  --line:#D3D1CA; --accent:#2B3FF2; --accent-ink:#FFFFFF; --stage:#D8D7D1;
  --shadow:0 22px 44px -20px rgba(24,24,40,.45), 0 2px 6px rgba(24,24,40,.12);
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141417; --surface:#1C1C20; --surface-2:#25252A; --ink:#EDECE7; --muted:#9C9A94;
  --line:#303036; --accent:#7A88FF; --accent-ink:#0E0E14; --stage:#0E0E11;
  --shadow:0 22px 44px -18px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141417; --surface:#1C1C20; --surface-2:#25252A; --ink:#EDECE7; --muted:#9C9A94;
  --line:#303036; --accent:#7A88FF; --accent-ink:#0E0E14; --stage:#0E0E11;
  --shadow:0 22px 44px -18px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4); color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.seed{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--muted)}

/* main grid */
.main{display:grid;grid-template-columns:184px minmax(0,1fr) 340px;min-height:0}
.rail{overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.rail h2,.panel h2,.vars h2{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.style-btn{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:10px;border:1px solid transparent;background:none}
.style-btn:hover{background:var(--surface-2)}
.style-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.style-btn .th{width:44px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);background:var(--surface-2)}
.style-btn .th svg{display:block;width:100%;height:100%}
.style-btn b{display:block;font-weight:600;font-size:13px}
.style-btn span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}

.center{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;background:var(--stage)}
.stage{min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px}
.poster{box-shadow:var(--shadow);line-height:0;flex:none}
.poster svg{display:block;width:100%;height:100%}
.vars{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px}
.vars-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.vars-head h2{margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 2px}
.legal{margin:8px 0 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted)}
.vars-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.var{flex:none;height:96px;border:1px solid var(--line);border-radius:4px;padding:0;background:var(--surface-2);overflow:hidden;line-height:0;transition:transform .15s}
.var:hover{transform:translateY(-2px);border-color:var(--ink)}
.var svg{height:100%;width:auto;display:block}

/* panel */
.panel{overflow:auto;border-left:1px solid var(--line);background:var(--surface)}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
.sec-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.sec-note{font-size:12.5px;color:var(--muted);margin:-6px 0 0;line-height:1.45}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label,.ctl .lbl{font-weight:500;font-size:13px}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;margin:0}
select,input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px;font-family:var(--f-mono);font-size:13px;line-height:1.4}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sub{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.sub>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:500;font-size:13px}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary small{color:var(--muted);font-weight:400;margin-left:auto;font-size:12px}
.sub>summary::after{content:'';width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
.sub[open]>summary::after{transform:rotate(45deg)}
.sub-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}

.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.palettes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pal-group{font-family:var(--f-mono);font-size:11px!important;font-weight:500!important;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-6px}
.shade-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.pal{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface-2);text-align:left;display:flex;flex-direction:column;gap:5px}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pal .strip{display:flex;height:16px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal .strip i{flex:1}
.pal span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.font-btn{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:6px 10px;color:var(--ink);min-width:0}
.font-btn svg{max-width:100%;max-height:100%;height:22px;width:auto;display:block}
.font-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.15);overflow:visible}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sw .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:11px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.sw:hover .x,.sw:focus-within .x{display:flex}
.sw-add{width:34px;height:34px;border-radius:8px;border:1px dashed var(--muted);background:none;color:var(--muted);font-size:18px;line-height:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface-2);position:relative}
.color-field i{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.color-field span{font-size:12.5px}
.color-field input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{height:32px;font-size:12.5px;padding:0 10px}

/* export popover */
.pop{position:fixed;top:60px;right:16px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;z-index:20;display:flex;flex-direction:column;gap:14px}
.pop h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.pop .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.pop .btn.primary{height:44px;justify-content:center;font-size:15px}
.scrim{position:fixed;inset:0;z-index:19;background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.mbar{display:none}
.hide-sm{}

@media (max-width:1180px){ .main{grid-template-columns:150px minmax(0,1fr) 310px} .style-btn{grid-template-columns:1fr} .style-btn .th{width:100%} .style-btn span{display:none} }
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  .hide-sm{display:none!important}
  .main{display:block}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;gap:8px}
  .rail h2{display:none}
  .style-btn{flex:none;width:76px;grid-template-columns:1fr;gap:4px;padding:4px}
  .style-btn .th{width:100%}
  .style-btn b{font-size:11.5px;text-align:center}
  .stage{padding:20px 16px}
  .panel{border-left:0;padding-bottom:84px}
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:15}
  .mbar .btn{flex:1;justify-content:center;height:44px}
  .pop{top:auto;bottom:0;right:0;left:0;width:auto;max-width:none;border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:90px}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>

    <button class="btn hide-sm" id="surpriseBtn" title="Random style, colors and settings (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Surprise me <span class="kbd">S</span></button>

  </header>

  <div class="main">

        <div class="vars-head"><h2>Variations — tap to use</h2><button class="link" id="moreVars">Show more</button></div>
        <div class="vars-grid" id="vars"></div>
        <p class="legal">© 2026 Shapepress. All rights reserved.</p>
      </div>

    <aside class="panel" id="panel" aria-label="Settings"></aside>
  </div>
</div>

<div class="mbar">
  <button class="btn" id="mLayout">New layout</button>
  <button class="btn" id="mSurprise">Surprise</button>

</div>

    <div class="ctl-row"><input type="number" id="customPx" min="300" max="12000" step="100" aria-label="Custom width in pixels"><span class="seed">px wide</span></div>

</div>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f=n=>Math.round(n*100)/100;
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexToRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function lum(h){const c=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),fn=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgbToHex(fn(0)*255,fn(8)*255,fn(4)*255)}
function rgbToHsl(hex){let[r,g,b]=hexToRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sat=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;sat=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,sat*100,l*100]}
function shadesPalette(hex,dark){const[h,sat]=rgbToHsl(hex);const sv=Math.max(sat,18);const ls=dark?[14,28,44,62,82]:[16,32,50,68,86];

let UID=0;
function makeCtx(st,seed,box,W,H){
 const r=mulberry(seed);
 const c={r,W,H,box,bg:st.palette.bg,ink:st.palette.ink,C:st.palette.colors.slice(),uid:'p'+(++UID)+'_',defs:[],n:0};
 if(c.C.length<2)c.C.push(c.ink);
 c.ri=(a,b)=>Math.floor(a+r()*(b-a+1));
 c.rf=(a,b)=>a+r()*(b-a);
 c.pick=a=>a[Math.floor(r()*a.length)];
 c.chance=p=>r()<p;
 c.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 c.id=k=>c.uid+k+(c.n++);
 c.grad=t=>{const C=c.C;t=clamp(t,0,1)*(C.length-1);const i=Math.min(Math.floor(t),C.length-2);return mix(C[i],C[i+1],t-i)};
 c.other=(...not)=>{const nl=not.map(x=>String(x).toLowerCase());const pool=c.C.filter(x=>!nl.includes(x.toLowerCase()));return c.pick(pool.length?pool:c.C)};
 return c;
}
function laneColor(c,mode,i,n,list){
 if(mode==='ink')return c.ink;
 if(mode==='gradient')return c.grad(n<=1?0:i/(n-1));
 return list[i%list.length];
}
function smoothClosed(pts){const n=pts.length;let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}return d+'Z'}
function shapeEl(kind,cx,cy,rx,ry,attrs){
 if(kind==='circle')return`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" ${attrs}/>`;
 const rr=kind==='stadium'?Math.min(rx,ry):Math.min(rx,ry)*.18;
 return`<rect x="${f(cx-rx)}" y="${f(cy-ry)}" width="${f(rx*2)}" height="${f(ry*2)}" rx="${f(rr)}" ${attrs}/>`;
}

function motif(m,x,y,s,col,col2,c){
 const X=f(x),Y=f(y),S=f(s),h=s/2,H=f(h),cx=f(x+h),cy=f(y+h);
 switch(m){
  case'quarter':return`<path d="M${X} ${Y}H${f(x+s)}A${S} ${S} 0 0 1 ${X} ${f(y+s)}Z" fill="${col}"/>`;
  case'half':return`<path d="M${X} ${f(y+s)}H${f(x+s)}A${H} ${H} 0 0 0 ${X} ${f(y+s)}Z" fill="${col}"/>`;
  case'circle':return`<circle cx="${cx}" cy="${cy}" r="${H}" fill="${col}"/>`;
  case'ring':return`<circle cx="${cx}" cy="${cy}" r="${H}" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${f(h*.5)}" fill="${col2}"/>`;
  case'target':return`<circle cx="${cx}" cy="${cy}" r="${H}" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${f(h*.66)}" fill="${col2}"/><circle cx="${cx}" cy="${cy}" r="${f(h*.33)}" fill="${col}"/>`;
  case'stripes':{const n=c.pick([3,4,5]);let o='';for(let k=0;k<n;k++)o+=`<rect x="${X}" y="${f(y+k*s/n)}" width="${S}" height="${f(s/(2*n))}" fill="${col}"/>`;return o}
  case'tri':return`<path d="M${X} ${f(y+s)}L${f(x+s)} ${f(y+s)}L${X} ${Y}Z" fill="${col}"/>`;
  case'eye':{const pc=col2===c.ink?c.bg:c.ink;return`<path d="M${X} ${cy}Q${cx} ${f(y-s*.12)} ${f(x+s)} ${cy}Q${cx} ${f(y+s*1.12)} ${X} ${cy}Z" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${f(s*.22)}" fill="${col2}"/><circle cx="${cx}" cy="${cy}" r="${f(s*.09)}" fill="${pc}"/>`}
  case'leaf':return`<path d="M${X} ${f(y+s)}A${S} ${S} 0 0 1 ${f(x+s)} ${Y}A${S} ${S} 0 0 1 ${X} ${f(y+s)}Z" fill="${col}"/>`;
  case'arch':return`<path d="M${X} ${f(y+s)}V${cy}A${H} ${H} 0 0 1 ${f(x+s)} ${cy}V${f(y+s)}Z" fill="${col}"/>`;
  case'dots':{let o='';for(let i=0;i<3;i++)for(let j=0;j<3;j++)o+=`<circle cx="${f(x+s*(1+2*i)/6)}" cy="${f(y+s*(1+2*j)/6)}" r="${f(s/9)}" fill="${col}"/>`;return o}
  case'split':return`<path d="M${X} ${cy}A${H} ${H} 0 0 1 ${f(x+s)} ${cy}Z" fill="${col}"/><path d="M${X} ${cy}A${H} ${H} 0 0 0 ${f(x+s)} ${cy}Z" fill="${col2}"/>`;
  case'checker':{let o='';const q=s/4;for(let i=0;i<4;i++)for(let j=0;j<4;j++)if((i+j)%2===0)o+=`<rect x="${f(x+i*q)}" y="${f(y+j*q)}" width="${f(q)}" height="${f(q)}" fill="${col}"/>`;return o}
  case'block':return`<rect x="${X}" y="${Y}" width="${S}" height="${S}" fill="${col}"/>`;
  case'diamond':return`<path d="M${cx} ${Y}L${f(x+s)} ${cy}L${cx} ${f(y+s)}L${X} ${cy}Z" fill="${col}"/>`;
  case'star4':return`<path d="M${cx} ${Y}Q${cx} ${cy} ${f(x+s)} ${cy}Q${cx} ${cy} ${cx} ${f(y+s)}Q${cx} ${cy} ${X} ${cy}Q${cx} ${cy} ${cx} ${Y}Z" fill="${col}"/>`;
  case'pie':return`<path d="M${cx} ${cy}L${f(x+s)} ${cy}A${H} ${H} 0 1 1 ${cx} ${Y}Z" fill="${col}"/>`;
  case'moon':return`<path d="M${cx} ${Y}A${H} ${H} 0 1 0 ${cx} ${f(y+s)}A${f(h*.62)} ${H} 0 1 1 ${cx} ${Y}Z" fill="${col}"/>`;
  case'flower':{let o='';[[x,y],[x+s,y],[x+s,y+s],[x,y+s]].forEach(([qx,qy])=>o+=`<path d="M${cx} ${cy}A${H} ${H} 0 0 1 ${f(qx)} ${f(qy)}A${H} ${H} 0 0 1 ${cx} ${cy}Z" fill="${col}"/>`);return o}
  case'concentric':{let o='';for(let k=0;k<4;k++){const i=k*s/8;o+=`<rect x="${f(x+i)}" y="${f(y+i)}" width="${f(s-2*i)}" height="${f(s-2*i)}" fill="${k%2?col2:col}"/>`}return o}
  case'bowtie':return`<path d="M${X} ${Y}L${cx} ${cy}L${X} ${f(y+s)}ZM${f(x+s)} ${Y}L${cx} ${cy}L${f(x+s)} ${f(y+s)}Z" fill="${col}"/>`;

python:{name:'life.py',lang:'Python',src:String.raw`from dataclasses import dataclass
from itertools import product
import random


@dataclass(frozen=True)
class Board:
    width: int
    height: int
    cells: frozenset

    @classmethod
    def random(cls, w, h, density=0.3):
        alive = {(x, y) for x, y in product(range(w), range(h))
                 if random.random() < density}
        return cls(w, h, frozenset(alive))

    def neighbours(self, x, y):
        for dx, dy in product((-1, 0, 1), repeat=2):
            if dx or dy:
                yield (x + dx) % self.width, (y + dy) % self.height

    def step(self):
        counts = {}
        for cell in self.cells:
            for n in self.neighbours(*cell):
                counts[n] = counts.get(n, 0) + 1
        born = {c for c, k in counts.items() if k == 3}
        kept = {c for c in self.cells if counts.get(c, 0) in (2, 3)}
        return Board(self.width, self.height, frozenset(born | kept))

    def render(self):
        rows = []
        for y in range(self.height):
            row = "".join("#" if (x, y) in self.cells else "."
                          for x in range(self.width))
            rows.append(row)
        return "\n".join(rows)


if __name__ == "__main__":
    board = Board.random(48, 24)
    for generation in range(100):
        print(f"gen {generation:03d}  alive={len(board.cells)}")
        board = board.step()
    print(board.render())`},
javascript:{name:'particles.js',lang:'JavaScript',src:String.raw`const canvas = document.querySelector('#stage');
const ctx = canvas.getContext('2d');
const particles = [];
const GRAVITY = 0.12;
const FRICTION = 0.985;

function spawn(x, y, count = 64) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      hue: (performance.now() / 20 + i * 4) % 360,
    });
  }
}

function update(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx *= FRICTION;
    p.vy = p.vy * FRICTION + GRAVITY;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= 0.008 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = 'rgba(10, 10, 18, 0.22)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) {
    ctx.fillStyle = 'hsla(' + p.hue + ', 90%, 60%, ' + p.life + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + p.life * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(3, (now - last) / 16.67);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown', (e) => spawn(e.offsetX, e.offsetY));
requestAnimationFrame(frame);`},
rust:{name:'rpn.rs',lang:'Rust',src:String.raw`use std::iter::Peekable;
use std::str::Chars;

#[derive(Debug, Clone, PartialEq)]
enum Token {
    Num(f64),
    Op(char),
    LParen,
    RParen,
}

struct Lexer<'a> {
    chars: Peekable<Chars<'a>>,
}

impl<'a> Lexer<'a> {
    fn new(src: &'a str) -> Self {
        Lexer { chars: src.chars().peekable() }
    }
}

impl<'a> Iterator for Lexer<'a> {
    type Item = Token;

    fn next(&mut self) -> Option<Token> {
        while let Some(&c) = self.chars.peek() {
            match c {
                ' ' | '\t' => { self.chars.next(); }
                '0'..='9' | '.' => {
                    let mut s = String::new();
                    while let Some(&d) = self.chars.peek() {
                        if d.is_ascii_digit() || d == '.' {
                            s.push(d);
                            self.chars.next();
                        } else {
                            break;
                        }
                    }
                    return s.parse().ok().map(Token::Num);
                }
                '(' => { self.chars.next(); return Some(Token::LParen); }
                ')' => { self.chars.next(); return Some(Token::RParen); }
                _ => { self.chars.next(); return Some(Token::Op(c)); }
            }
        }
        None
    }
}

fn precedence(op: char) -> u8 {
    match op { '+' | '-' => 1, '*' | '/' => 2, '^' => 3, _ => 0 }
}

pub fn to_rpn(src: &str) -> Vec<Token> {
    let mut out = Vec::new();
    let mut stack: Vec<Token> = Vec::new();
    for tok in Lexer::new(src) {
        match tok {
            Token::Num(_) => out.push(tok),
            Token::Op(o) => {
                while let Some(Token::Op(top)) = stack.last() {
                    if precedence(*top) < precedence(o) { break; }
                    out.push(stack.pop().unwrap());
                }
                stack.push(tok);
            }
            Token::LParen => stack.push(tok),
            Token::RParen => {
                while let Some(t) = stack.pop() {
                    if t == Token::LParen { break; }
                    out.push(t);
                }
            }
        }
    }
    while let Some(t) = stack.pop() { out.push(t); }
    out
}`},
go:{name:'counter.go',lang:'Go',src:String.raw`package main

import (
	"encoding/json"
	"log"
	"net/http"
	"sync"
	"time"
)

type Counter struct {
	mu    sync.Mutex
	hits  map[string]int
	start time.Time
}

func NewCounter() *Counter {
	return &Counter{hits: make(map[string]int), start: time.Now()}
}

func (c *Counter) Inc(path string) int {
	c.mu.Lock()
	defer c.mu.Unlock()
	c.hits[path]++
	return c.hits[path]
}

func (c *Counter) ServeHTTP(w http.ResponseWriter, r *http.Request) {
	n := c.Inc(r.URL.Path)
	w.Header().Set("Content-Type", "application/json")
	json.NewEncoder(w).Encode(map[string]any{
		"path":   r.URL.Path,
		"hits":   n,
		"uptime": time.Since(c.start).Round(time.Second).String(),
	})
}

func main() {
	counter := NewCounter()
	mux := http.NewServeMux()
	mux.Handle("/", counter)
	srv := &http.Server{
		Addr:         ":8080",
		Handler:      mux,
		ReadTimeout:  5 * time.Second,
		WriteTimeout: 10 * time.Second,
	}
	log.Printf("listening on %s", srv.Addr)
	log.Fatal(srv.ListenAndServe())
}`},
c:{name:'wordcount.c',lang:'C',src:String.raw`#include <stdio.h>
#include <stdlib.h>
#include <string.h>

#define BUCKETS 64

typedef struct Node {
    char *key;
    int value;
    struct Node *next;
} Node;

static unsigned long hash(const char *s) {
    unsigned long h = 5381;
    int c;
    while ((c = *s++))
        h = ((h << 5) + h) + c;
    return h % BUCKETS;
}

void put(Node **table, const char *key, int value) {
    unsigned long i = hash(key);
    for (Node *n = table[i]; n; n = n->next) {
        if (strcmp(n->key, key) == 0) {
            n->value = value;
            return;
        }
    }
    Node *n = malloc(sizeof *n);
    n->key = strdup(key);
    n->value = value;
    n->next = table[i];
    table[i] = n;
}

int get(Node **table, const char *key, int fallback) {
    for (Node *n = table[hash(key)]; n; n = n->next)
        if (strcmp(n->key, key) == 0)
            return n->value;
    return fallback;
}

int main(void) {
    Node *table[BUCKETS] = {0};
    char word[128];
    while (scanf("%127s", word) == 1)
        put(table, word, get(table, word, 0) + 1);
    printf("the: %d\n", get(table, "the", 0));
    return 0;
}`},
glsl:{name:'tunnel.frag',lang:'GLSL',src:String.raw`#version 300 es
precision highp float;

uniform vec2 uResolution;
uniform float uTime;
out vec4 fragColor;

float sdCircle(vec2 p, float r) {
    return length(p) - r;
}

float sdBox(vec2 p, vec2 b) {
    vec2 d = abs(p) - b;
    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

mat2 rotate(float a) {
    float s = sin(a), c = cos(a);
    return mat2(c, -s, s, c);
}

vec3 palette(float t) {
    vec3 a = vec3(0.5), b = vec3(0.5);
    vec3 c = vec3(1.0), d = vec3(0.00, 0.33, 0.67);
    return a + b * cos(6.28318 * (c * t + d));
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;
    vec3 col = vec3(0.0);
    for (int i = 0; i < 4; i++) {
        uv = fract(uv * 1.5) - 0.5;
        uv *= rotate(uTime * 0.2 + float(i));
        float d = min(sdCircle(uv, 0.3), sdBox(uv, vec2(0.18)));
        d = sin(d * 8.0 + uTime) / 8.0;
        d = abs(d);
        d = pow(0.01 / d, 1.2);
        col += palette(length(uv) + float(i) * 0.4 + uTime * 0.4) * d;
    }
    fragColor = vec4(col, 1.0);
}`},
sql:{name:'revenue.sql',lang:'SQL',src:String.raw`-- monthly revenue with running totals and rank per region
WITH orders_clean AS (
    SELECT
        o.id,
        o.customer_id,
        c.region,
        DATE_TRUNC('month', o.created_at) AS month,
        o.total_cents / 100.0 AS total
    FROM orders o
    JOIN customers c ON c.id = o.customer_id
    WHERE o.status = 'paid'
      AND o.created_at >= NOW() - INTERVAL '12 months'
),
monthly AS (
    SELECT region, month, SUM(total) AS revenue, COUNT(*) AS orders
    FROM orders_clean
    GROUP BY region, month
)
SELECT
    region,
    month,
    revenue,
    orders,
    SUM(revenue) OVER (PARTITION BY region ORDER BY month) AS running_total,
    RANK() OVER (PARTITION BY month ORDER BY revenue DESC) AS rank_in_month,
    ROUND(100.0 * (revenue - LAG(revenue) OVER w)
          / NULLIF(LAG(revenue) OVER w, 0), 1) AS growth_pct
FROM monthly
WINDOW w AS (PARTITION BY region ORDER BY month)
ORDER BY month DESC, rank_in_month;`},

haskell:{name:'Main.hs',lang:'Haskell',src:String.raw`module Main where

import Data.List (sortOn)
import qualified Data.Map.Strict as Map

data Shape
  = Circle Double
  | Rect Double Double
  | Triangle Double Double Double
  deriving (Show, Eq)

area :: Shape -> Double
area (Circle r)       = pi * r * r
area (Rect w h)       = w * h
area (Triangle a b c) = sqrt (s * (s - a) * (s - b) * (s - c))
  where s = (a + b + c) / 2

primes :: [Int]
primes = sieve [2 ..]
  where sieve (p : xs) = p : sieve [x | x <- xs, mod x p /= 0]

frequencies :: Ord a => [a] -> Map.Map a Int
frequencies = Map.fromListWith (+) . map (\x -> (x, 1))

quicksort :: Ord a => [a] -> [a]
quicksort [] = []
quicksort (p : xs) = quicksort lo ++ [p] ++ quicksort hi
  where (lo, hi) = (filter (< p) xs, filter (>= p) xs)

main :: IO ()
main = do
  let shapes = [Circle 1.5, Rect 2 3, Triangle 3 4 5]
  mapM_ (print . area) (sortOn area shapes)
  print (take 12 primes)
  print (frequencies "mississippi")
  print (quicksort [9, 4, 7, 1, 8, 2])`},
asm:{name:'hello.asm',lang:'Assembly',src:String.raw`; hello.asm - x86-64 Linux
; nasm -f elf64 hello.asm && ld -o hello hello.o
section .data
    msg     db  "hello, screen", 10
    len     equ $ - msg

section .bss
    buf     resb 64

section .text
    global _start

_start:
    mov     rcx, 5              ; print five times
.loop:
    push    rcx
    mov     rax, 1              ; sys_write
    mov     rdi, 1              ; stdout
    lea     rsi, [rel msg]
    mov     rdx, len
    syscall
    pop     rcx
    dec     rcx
    jnz     .loop

    mov     rax, 60             ; sys_exit
    xor     rdi, rdi
    syscall`},
tsx:{name:'RepoList.tsx',lang:'TypeScript',src:String.raw`import { useEffect, useMemo, useState } from 'react';

type Repo = { id: number; name: string; stars: number; language: string | null };

export function RepoList({ user }: { user: string }) {
  const [repos, setRepos] = useState<Repo[]>([]);
  const [query, setQuery] = useState('');
  const [error, setError] = useState<string | null>(null);

  useEffect(() => {
    const ctrl = new AbortController();
    fetch('https://api.github.com/users/' + user + '/repos', { signal: ctrl.signal })
      .then((r) => (r.ok ? r.json() : Promise.reject(r.statusText)))
      .then((data) => setRepos(data.map((d: any) => ({
        id: d.id, name: d.name, stars: d.stargazers_count, language: d.language,
      }))))
      .catch((e) => e.name !== 'AbortError' && setError(String(e)));
    return () => ctrl.abort();
  }, [user]);

  const visible = useMemo(
    () => repos
      .filter((r) => r.name.toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => b.stars - a.stars),
    [repos, query],
  );

  if (error) return <p role="alert">Could not load repos: {error}</p>;

  return (
    <section>
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Filter" />
      <ul>
        {visible.map((r) => (
          <li key={r.id}>
            <strong>{r.name}</strong> <span>{r.stars} stars</span>
          </li>
        ))}
      </ul>
    </section>
  );
}`},
clojure:{name:'core.clj',lang:'Clojure',src:String.raw`(ns studio.core
  (:require [clojure.string :as str]))

(defn word-freq [text]
  (->> (str/split (str/lower-case text) #"\W+")
       (remove str/blank?)
       frequencies
       (sort-by val >)
       (take 10)))

(defn fib-seq []
  (map first (iterate (fn [[a b]] [b (+ a b)]) [0 1])))

(defn mandel [cx cy max-iter]
  (loop [x 0.0 y 0.0 i 0]
    (if (or (> (+ (* x x) (* y y)) 4.0) (= i max-iter))
      i
      (recur (+ (- (* x x) (* y y)) cx) (+ (* 2 x y) cy) (inc i)))))

(defn ascii-mandel [w h]
  (str/join "\n"
    (for [row (range h)]
      (apply str
        (for [col (range w)]
          (let [n (mandel (- (* 3.0 (/ col w)) 2.2)
                          (- (* 2.4 (/ row h)) 1.2) 40)]
            (nth " .:-=+*#%@" (quot n 5))))))))

(defn -main [& _]
  (println (take 15 (fib-seq)))
  (println (word-freq "the quick brown fox jumps over the lazy dog"))
  (println (ascii-mandel 72 28)))`}

 tf('tTitle','Title','title','autoTitle');

 b.appendChild(toggleCtl('tTitle-auto','New title with each layout',T.autoTitle,v=>{T.autoTitle=v;if(v){autoText();refreshPanelText()}draw()}));
 tf('tSub','Subtitle','sub');tf('tNum','Number','num','autoNum');tf('tEd','Corner note','edition');
 b.appendChild(rangeCtl('tSize','Text size',T.size,60,180,1,'%',v=>{T.size=v;draw()}));
}
function refreshPanelText(){const t=document.getElementById('tTitle');if(t)t.value=S.text.title;const n=document.getElementById('tNum');if(n)n.value=S.text.num}
function refreshAll(){markRail();buildPanel();draw()}

/* ============ actions ============ */
function newLayout(){S.seed=newSeed();autoText();commit();refreshPanelText();draw()}
function surprise(){const r=Math.random;S.style=STYLE_KEYS[Math.floor(r()*STYLE_KEYS.length)];S.params[S.style]=randomParams(S.style,r,defaults(S.style));
 S.palette=r()<.75?JSON.parse(JSON.stringify(PALETTES[Math.floor(r()*PALETTES.length)])):randomPalette();S.panel.on=r()<.15;if(S.panel.on)S.panel.color=S.palette.ink;S.seed=newSeed();autoText();commit();refreshAll()}
$('#layoutBtn').onclick=newLayout;$('#mLayout').onclick=newLayout;$('#surpriseBtn').onclick=surprise;$('#mSurprise').onclick=surprise;
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#moreVars').onclick=()=>{rollVars();renderVars()};
document.addEventListener('keydown',e=>{const t=e.target;if(t.matches&&t.matches('input[type=text],input[type=number],textarea,select'))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='r'||e.key==='R')newLayout();else if(e.key==='s'||e.key==='S')surprise();else if(e.key==='Escape')closePop()});

/* ============ export ============ */
let downloads=null;try{window.claude?.use?.('downloads')?.then(d=>{downloads=d}).catch(()=>{})}catch(e){}
const EX={type:'png',px:3000};const SIZES=[[1500,'Screen'],[3000,'Print'],[6000,'Large print']];
function openPop(){$('#pop').hidden=false;$('#scrim').hidden=false;buildPop()}
function closePop(){$('#pop').hidden=true;$('#scrim').hidden=true}
$('#downloadBtn').onclick=openPop;$('#mDownload').onclick=openPop;$('#popClose').onclick=closePop;$('#scrim').onclick=closePop;
function buildPop(){const seg=$('#fmtSeg');seg.innerHTML='';[['png','PNG image'],['svg','SVG vector']].forEach(([v,l])=>{const b=el('button',{'aria-pressed':String(EX.type===v)},l);b.onclick=()=>{EX.type=v;buildPop()};seg.appendChild(b)});
 const ch=$('#sizeChips');ch.innerHTML='';SIZES.forEach(([px,l])=>{const b=el('button',{class:'chip','aria-pressed':String(EX.px===px)},`${l} · ${px}px`);b.onclick=()=>{EX.px=px;buildPop()};ch.appendChild(b)});
 $('#customPx').value=EX.px;$('#sizeCtl').hidden=EX.type!=='png';$('#doExport').textContent=EX.type==='png'?'Download PNG':'Download SVG';updateMeta()}
$('#customPx').oninput=e=>{const v=+e.target.value;if(v>=300&&v<=12000){EX.px=Math.round(v);document.querySelectorAll('#sizeChips .chip').forEach(c=>c.setAttribute('aria-pressed','false'));updateMeta()}};
function updateMeta(){const fmt=FORMATS.find(x=>x.id===S.format);const h=Math.round(EX.px*fmt.ratio);
 if(EX.type==='png'){const cmw=(EX.px/300*2.54).toFixed(0),cmh=(h/300*2.54).toFixed(0),inw=(EX.px/300).toFixed(1),inh=(h/300).toFixed(1);
  $('#exportMeta').innerHTML=`${EX.px} × ${h} px<br>Prints sharp up to ${cmw} × ${cmh} cm (${inw} × ${inh} in) at 300 dpi`}
 else $('#exportMeta').innerHTML='Vector file — scales to any size without losing quality.<br>Opens in Illustrator, Figma, Affinity and Inkscape.'}
function fileBase(){return('shapepress-'+STYLES[S.style].name+'-'+(S.text.title||'poster')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+S.seed.toString(36)}
function svgToPng(svgStr,w,h){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(new Blob([svgStr],{type:'image/svg+xml'}));
 img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(new Error('size')),'image/png')}catch(e){rej(e)}};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('render'))};img.src=url})}
async function saveBlob(name,blob){
 if(downloads){try{await downloads.save({filename:name,data:blob});toast('Saved '+name)}catch(e){toast(e&&e.code==='declined'?'Download cancelled':'This view could not save the file. Try a smaller size.')}return}
 const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Downloading '+name)}
$('#doExport').onclick=async()=>{const btn=$('#doExport');const opts={transparent:$('#exTransparent').checked,noText:!$('#exText').checked};
 btn.disabled=true;const label=btn.textContent;btn.textContent='Preparing…';
 try{if(EX.type==='svg'){const{svg,W,H}=poster(S,{...opts,px:null});const out=svg.replace('<svg ',`<svg width="${W*2}" height="${H*2}" `);await saveBlob(fileBase()+'.svg',new Blob([out],{type:'image/svg+xml'}))}
  else{const w=EX.px;const{svg,W:W0,H:H0}=poster(S,{...opts,px:w});const h=Math.round(w*H0/W0);const blob=await svgToPng(svg,w,h);await saveBlob(fileBase()+'.png',blob)}
  closePop()}catch(e){toast('Your browser could not make an image this large. Pick a smaller size and try again.')}
 finally{btn.disabled=false;btn.textContent=label}};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ============ boot ============ */
buildRail();buildPanel();updateHistBtns();draw();
</script>
